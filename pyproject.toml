[project]
name = "mithril"
version = "0.1.0"
description = "Rule mining over Biolink knowledge graphs with Biolink query semantics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "cbizon", email = "bizon@renci.org" }
]
requires-python = ">=3.12"
dependencies = [
    "bmt>=1.5.0",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "orjson>=3.13.0",
    "python-graphblas>=2025.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
mithril = "mithril.cli:main"

[tool.pytest.ini_options]
addopts = "--doctest-modules"
pythonpath = ["tests"]
testpaths = ["tests", "src"]
