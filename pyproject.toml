[project]
name = "biolink-rules"
version = "0.1.0"
description = "Rule mining over Biolink knowledge graphs with Biolink query semantics"
readme = "README.md"
authors = [
    { name = "cbizon", email = "bizon@renci.org" }
]
requires-python = ">=3.12"
dependencies = [
    "bmt>=1.5.0",
    "gandalf-csr",
    "numpy>=2.5.4",
    "orjson>=3.13.0",
    "python-graphblas>=2025.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
biolink-rules = "biolink_rules.cli:main"

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]

[tool.uv.sources]
gandalf-csr = { path = "../gandalf", editable = true }
